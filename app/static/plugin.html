<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Evidence Verifier · 对话伴随插件预览</title>
  <link rel="stylesheet" href="plugin.css">
</head>
<body>
  <header class="panel-brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M5 8h21M5 16h13M5 24h9M20 23l4 4 7-12"/>
    </svg>
    <div>
      <h1>Evidence Verifier</h1>
      <p>自动伴随对话核验插件</p>
    </div>
    <span class="mode">自动辅助开启</span>
  </header>
  <main>
    <p id="panel-source" class="source-note">产品示例 · 模型判断预设，原文定位与关系绑定由程序执行。</p>

    <section id="selection" hidden>
      <label for="selected-answer">当前选中的回答</label>
      <textarea id="selected-answer" rows="3" readonly></textarea>
      <p id="selection-note" class="meta">选中内容仅保留在当前插件会话，以下检测展示预设案例。</p>
    </section>

    <div class="plugin-case-bar">
      <label for="panel-case">演练场景</label>
      <select id="panel-case" disabled>
        <option>正在载入案例</option>
      </select>
    </div>

    <div class="captured-box">
      <span class="captured-kicker">已自动捕获最新 AI 回答（DOM 流式结束）</span>
      <p id="panel-answer" class="candidate"></p>
    </div>

    <button id="panel-run" class="primary" disabled>重新执行自动核验</button>
    <p id="panel-error" class="error" role="alert" hidden></p>

    <section id="panel-result" aria-live="polite" hidden>
      <div id="panel-role-strip" class="plugin-role-strip"></div>
      <div id="panel-verdict" class="verdict-box"></div>
      <div id="panel-action-card" class="concise-action-card"></div>

      <div id="panel-repair-row" class="repair-row">
        <button id="panel-repair" class="secondary">05 自动补入就读证据 E3 并复核</button>
      </div>

      <div id="panel-draft-box" class="draft-box" hidden>
        <label for="panel-draft-input">原 AI 对话输入框草稿预览（已填入，未自动发送）</label>
        <textarea id="panel-draft-input" rows="4" readonly></textarea>
      </div>

      <details class="evidence-details" open>
        <summary>查看必要关系链与原文字符定位 (<span id="relation-count"></span>)</summary>
        <div id="panel-relations"></div>
        <div id="panel-citation"></div>
      </details>

      <details class="reason-details">
        <summary>展开查看多角色核验依据与缺口检索词</summary>
        <p id="panel-explanation"></p>
        <div id="panel-queries"></div>
        <p class="meta">边界说明：仅核验已声明关系与公开引用原文，不读取隐藏思维链。</p>
      </details>
    </section>

    <footer>
      <span>无错不打扰 · 有缺口一键补入修订提示</span>
      <button id="panel-workbench" class="text-action">打开完整工作台</button>
    </footer>
  </main>
  <script src="plugin.js"></script>
</body>
</html>
