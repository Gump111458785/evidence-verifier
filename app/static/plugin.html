<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Verifier · LLM侧栏</title><link rel="stylesheet" href="plugin.css"></head>
<body><header class="panel-brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h21M5 16h13M5 24h9M20 23l4 4 7-12"/></svg><div><h1>Evidence Verifier</h1><p>LLM 回答侧栏审查</p></div><span class="mode">演示</span></header><main>
<p id="panel-source" class="source-note">理想场景 · 模型结果预设，引用与绑定由程序回放。</p>
<section id="selection" hidden><label for="selected-answer">当前选中的回答</label><textarea id="selected-answer" rows="3" readonly></textarea><p id="selection-note" class="meta">选中内容仅保留在当前插件会话，以下检测展示预设案例。</p></section>
<label for="panel-case">审查案例</label><select id="panel-case" disabled><option>正在载入案例</option></select>
<p id="panel-answer" class="candidate"></p><button id="panel-run" class="primary" disabled>审查示例回答</button><p id="panel-error" class="error" role="alert" hidden></p>
<section id="panel-result" aria-live="polite" hidden><div id="panel-verdict" class="verdict-box"></div><div class="result-heading"><h2>必要关系与引用</h2><span id="relation-count"></span></div><div id="panel-relations"></div><div id="panel-citation"></div><button id="panel-repair" class="secondary">补入关键教育证据</button><details class="reason-details"><summary>为什么需要拆分核验</summary><p id="panel-explanation"></p><div id="panel-queries"></div><p class="meta">只检查这些声明关系，不判断证据本身的客观真假。</p></details></section>
<footer><span>证据可定位 · 关系可追溯</span><button id="panel-workbench" class="text-action">打开工作台</button></footer>
</main><script src="plugin.js"></script></body></html>
