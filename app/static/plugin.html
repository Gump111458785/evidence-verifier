<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trisight 三省 · 对话伴随插件</title>
  <link rel="stylesheet" href="plugin.css">
</head>
<body>
  <header class="panel-brand">
    <div class="panel-brand-left">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M2 6h9" stroke="#c03a2b" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M5 15l3-5 3 5" fill="none" stroke="#2353b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 13h5m-2-2.5 2 2.5-2 2.5" fill="none" stroke="#0d7566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Trisight 三省</h1>
        <p>对话伴随审阅插件</p>
      </div>
    </div>
    <span class="mode">自动辅助</span>
  </header>
  <main>
    <p id="panel-source" class="source-note">演示示例 · 展示插件在对话页旁的精简审阅形态。</p>

    <section id="selection" hidden>
      <label for="selected-answer">当前选中的回答</label>
      <textarea id="selected-answer" rows="3" readonly></textarea>
      <p id="selection-note" class="meta">选中内容仅保留在当前插件会话。</p>
    </section>

    <div class="plugin-case-bar">
      <label for="panel-case">演练场景</label>
      <select id="panel-case" disabled>
        <option>正在载入案例</option>
      </select>
    </div>

    <div class="captured-box">
      <span class="captured-kicker">已捕获当前 AI 回答</span>
      <p id="panel-answer" class="candidate"></p>
    </div>

    <button id="panel-run" class="primary" disabled>重新执行审阅</button>
    <p id="panel-error" class="error" role="alert" hidden></p>

    <section id="panel-result" aria-live="polite" hidden>
      <div id="panel-verdict" class="verdict-box"></div>
      <div id="panel-action-card" class="concise-action-card"></div>

      <div id="panel-repair-row" class="repair-row">
        <button id="panel-repair" class="secondary">补入教育证据 E3 并复核</button>
      </div>

      <div id="panel-draft-box" class="draft-box" hidden>
        <label for="panel-draft-input">原对话输入框草稿预览（已填入，未发送）</label>
        <textarea id="panel-draft-input" rows="4" readonly></textarea>
      </div>

      <details class="evidence-details" open>
        <summary>原文引文与关系定位 (<span id="relation-count"></span>)</summary>
        <div id="panel-relations"></div>
        <div id="panel-citation"></div>
      </details>

      <details class="reason-details">
        <summary>核验说明与检索词</summary>
        <p id="panel-explanation"></p>
        <div id="panel-queries"></div>
      </details>
    </section>

    <footer>
      <span>无错不打扰 · 有缺口一键填入草稿</span>
      <button id="panel-workbench" class="text-action">打开网页审阅</button>
    </footer>
  </main>
  <script src="plugin.js"></script>
</body>
</html>
