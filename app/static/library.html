<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>案例库：Trisight 三省</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/trisight.css">
</head>
<body>
  <div class="ts-bar-wrap"><header id="ts-bar"></header></div>
  <main class="ts-page">
    <h1>案例库</h1>
    <div class="ts-split" style="margin-top:20px">
      <div>
        <ul class="list" id="list"></ul>
        <p class="ts-meta" id="list-meta"></p>
      </div>
      <section id="detail" class="ts-sheet" aria-live="polite"><p class="res-empty">从左侧选择一条查看。</p></section>
    </div>
  </main>

  <script src="/trisight.js"></script>
  <script>
  (async () => {
    if (location.hash === '#history') {
      location.replace('/history.html');
      return;
    }
    const user = await TS.me();
    TS.bar('library', user);
    const $ = (id) => document.getElementById(id);
    const list = $('list'), detail = $('detail');
    const MODE = { correct: '纠错', supplement: '补充', predict: '预测' };
    let cases = [];

    function select(btn) {
      list.querySelectorAll('button').forEach((b) => b.setAttribute('aria-current', b === btn ? 'true' : 'false'));
    }

    function showCase(i) {
      const c = cases[i];
      if (!c) return;
      TS.render(detail, { question: c.question, answer: c.answer, result: c.result });
      if (c.evidence && c.evidence.length) {
        const ev = document.createElement('div');
        ev.className = 'ts-note';
        ev.style.marginTop = '16px';
        ev.innerHTML = c.evidence.map((e) => TS.esc(e.title) + '：“' + TS.esc(e.text) + '”').join('<br>');
        detail.appendChild(ev);
      }
    }

    try {
      cases = (await TS.api('/api/library')).cases || [];
      list.innerHTML = cases.map((c, i) =>
        '<li><button type="button" data-i="' + i + '">' +
          '<span class="t">' + TS.esc(c.title) + '</span>' +
          '<span class="item-q">' + TS.esc(c.question) + '</span>' +
          '<span class="item-badges">' + c.tags.map((t) => '<span class="mode-pill ' + t + '">' + MODE[t] + '</span>').join('') + '</span>' +
        '</button></li>'
      ).join('');
      $('list-meta').textContent = '共 ' + cases.length + ' 个案例';
      list.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
        select(b);
        showCase(+b.dataset.i);
      }));
      const first = list.querySelector('button');
      if (first) {
        select(first);
        showCase(0);
      }
    } catch (e) {
      TS.alertIn(detail, e.message);
    }
  })();
  </script>
</body>
</html>
