<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trisight 三省</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="sidecar.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 6h9" stroke="#c03a2b" stroke-width="2.2" stroke-linecap="round"/><path d="M5 15l3-5 3 5" fill="none" stroke="#2353b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 13h5m-2-2.5 2 2.5-2 2.5" fill="none" stroke="#1c2230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-name">Trisight</span>
    </div>
    <nav id="views" class="nav" role="tablist" aria-label="功能切换" hidden>
      <button type="button" id="nav-review" class="nav-btn" data-view="review" role="tab" aria-selected="true">审查</button>
      <button type="button" id="nav-history" class="nav-btn" data-view="history" role="tab" aria-selected="false">历史</button>
    </nav>
    <button type="button" id="src" class="src" data-state="idle" aria-expanded="false" aria-controls="drawer" title="查看读取到的问答" hidden>
      <i class="pulse" aria-hidden="true"></i><span id="src-name">—</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button type="button" id="logout" class="icon-btn" title="退出登录" aria-label="退出登录" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <form id="login" class="login" novalidate hidden>
    <input id="login-id" class="field" type="text" autocomplete="username" placeholder="用户名或邮箱" aria-label="用户名或邮箱">
    <input id="login-pw" class="field" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码">
    <div id="login-err" class="alert" role="alert" hidden></div>
    <button type="submit" id="login-btn" class="act primary">登录</button>
  </form>

  <section id="drawer" class="drawer" hidden>
    <label><b>问</b><textarea id="question" class="field" rows="2" maxlength="1000"></textarea></label>
    <label><b>答</b><textarea id="candidate" class="field" rows="5" maxlength="5000"></textarea></label>
    <div id="ctx" class="ctx"></div>
  </section>

  <section id="ctx-drawer" class="drawer ctx-drawer" hidden>
    <div id="ctx-list" class="ctx-list"></div>
  </section>

  <div id="work" class="work" hidden>
    <div class="actions">
      <button type="button" id="run-auto" class="act primary" disabled>自动审查</button>
      <button type="button" id="run-manual" class="act" aria-expanded="false" aria-controls="chips" disabled>
        <svg class="play" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4v16l14-8z"/></svg>手动审查
      </button>
    </div>
    <div id="chips" class="chips" role="group" aria-label="审查项" hidden>
      <button type="button" class="chip" data-mode="correct" aria-pressed="true"><i class="dot correct"></i>纠错</button>
      <button type="button" class="chip" data-mode="supplement" aria-pressed="true"><i class="dot supplement"></i>补充</button>
      <button type="button" class="chip" data-mode="predict" aria-pressed="true"><i class="dot predict"></i>预测</button>
    </div>
    <div class="ctx-bar">
      <button type="button" id="toggle-ctx" class="ctx-toggle" aria-expanded="false" aria-controls="ctx-drawer" disabled>
        <span id="ctx-status" class="ctx-status">暂无更早上下文</span>
        <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="ctx-btns">
        <button type="button" id="toggle-qa" class="ctx-pull" aria-expanded="false" aria-controls="drawer">查看 QA</button>
        <button type="button" id="pull-ctx" class="ctx-pull">获取上下文</button>
      </div>
    </div>
    <div id="alert" class="alert" role="alert" hidden></div>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-tab="correct" aria-selected="true" disabled><i class="dot correct"></i>纠错<span class="count" id="n-correct" hidden></span></button>
      <button type="button" class="tab" role="tab" data-tab="supplement" aria-selected="false" disabled><i class="dot supplement"></i>补充<span class="count" id="n-supplement" hidden></span></button>
      <button type="button" class="tab" role="tab" data-tab="predict" aria-selected="false" disabled><i class="dot predict"></i>预测<span class="count" id="n-predict" hidden></span></button>
    </nav>
    <div id="meter" class="meter" aria-hidden="true" hidden><i></i><i></i><i></i></div>
    <main id="pane" class="pane empty" role="tabpanel" aria-live="polite"></main>
  </div>

  <div id="history" class="work history" hidden>
    <div id="hist-list-wrap" class="hist-wrap">
      <div class="hist-bar">
        <span id="hist-meta" class="ctx-status">我的审查历史</span>
        <button type="button" id="hist-refresh" class="ctx-pull">刷新</button>
      </div>
      <div id="hist-list" class="pane hist-list" aria-live="polite"></div>
    </div>

    <div id="hist-detail-wrap" class="hist-wrap" hidden>
      <div class="hist-bar">
        <button type="button" id="hist-back" class="ctx-pull">← 返回</button>
        <span id="hist-time" class="ctx-status"></span>
        <button type="button" id="hist-load" class="ctx-pull">带入审查</button>
      </div>
      <details class="hist-qa">
        <summary id="hist-q-sum">查看原问答</summary>
        <div id="hist-qa-body" class="hist-qa-body"></div>
      </details>
      <nav class="tabs" role="tablist">
        <button type="button" class="htab" role="tab" data-tab="correct" aria-selected="true" disabled><i class="dot correct"></i>纠错<span class="count" id="hn-correct" hidden></span></button>
        <button type="button" class="htab" role="tab" data-tab="supplement" aria-selected="false" disabled><i class="dot supplement"></i>补充<span class="count" id="hn-supplement" hidden></span></button>
        <button type="button" class="htab" role="tab" data-tab="predict" aria-selected="false" disabled><i class="dot predict"></i>预测<span class="count" id="hn-predict" hidden></span></button>
      </nav>
      <main id="hpane" class="pane" role="tabpanel" aria-live="polite"></main>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="sidecar.js"></script>
</body>
</html>
