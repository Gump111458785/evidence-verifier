<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录：Trisight 三省</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/trisight.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <a class="ts-brand" href="/"><svg class="ts-mark" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 6h9" stroke="#c03a2b" stroke-width="2.2" stroke-linecap="round"/><path d="M5 15l3-5 3 5" fill="none" stroke="#2353b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 13h5m-2-2.5 2 2.5-2 2.5" fill="none" stroke="#0d7566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Trisight</b><span>三省</span></a>
      <h1 id="login-form-title">登录</h1>
      <p>当前只对受邀账号开放。没有账号？请在 <a href="https://github.com/Gump111458785/evidence-verifier/issues" rel="noopener">GitHub 提 Issue</a> 联系我们。</p>

      <div class="ts-sheet ts-stack">
        <div id="login-error" class="ts-alert" role="alert" hidden></div>
        <div id="login-notice" class="ts-note" hidden></div>
        <form id="login-form" class="ts-stack" novalidate>
          <div>
            <label class="ts-label" for="login-identifier">用户名或邮箱</label>
            <input id="login-identifier" name="identifier" class="ts-field" type="text" autocomplete="username" required>
          </div>
          <div>
            <label class="ts-label" for="login-password">密码</label>
            <div class="pw">
              <input id="login-password" name="password" class="ts-field" type="password" autocomplete="current-password" required>
              <button type="button" id="password-toggle" aria-label="显示密码" aria-pressed="false">
                <svg class="ev-icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 12s3.6-6.5 9.8-6.5 9.8 6.5 9.8 6.5-3.6 6.5-9.8 6.5S2.2 12 2.2 12Z"></path><circle cx="12" cy="12" r="3.1"></circle></svg>
                <svg class="ev-icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"></path><path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path><path d="M9.88 5.09A10.4 10.4 0 0 1 12 4.8c6.2 0 9.8 7.2 9.8 7.2a16.8 16.8 0 0 1-3.16 4.19"></path><path d="M6.61 6.61A16.5 16.5 0 0 0 2.2 12s3.6 7.2 9.8 7.2a10.3 10.3 0 0 0 5.39-1.48"></path></svg>
              </button>
            </div>
          </div>
          <button type="submit" id="login-submit" class="ts-btn" style="width:100%"><span id="login-submit-text">登录</span></button>
        </form>
      </div>
      <p class="ts-meta" style="margin-top:16px"><a href="/library.html">先看看案例库</a></p>
    </div>
  </main>
  <script src="/login.js"></script>
</body>
</html>
