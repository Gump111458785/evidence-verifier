<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人中心：Trisight 三省</title>
  <link rel="icon" href="/favicon.svg?v=053" type="image/svg+xml">
  <link rel="stylesheet" href="/trisight.css">
</head>
<body>
  <div class="ts-bar-wrap"><header id="ts-bar"></header></div>
  <main class="ts-page">
    <h1>个人中心</h1>
    <p class="lead">管理你的个人资料、头像、登录密码与近期调用统计。</p>

    <div class="acct-grid">
      <section class="ts-sheet">
        <h2>个人资料与头像</h2>
        <div class="avatar-editor">
          <div id="avatar-preview" class="avatar-preview-box"></div>
          <label class="ts-btn quiet small" for="avatar-file" style="cursor:pointer">上传头像</label>
          <input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        </div>
        <dl class="kv" id="profile-kv"></dl>
        <form id="profile" class="ts-stack" style="margin-top:18px">
          <div><label class="ts-label" for="p-name">名称</label><input id="p-name" class="ts-field" maxlength="48"></div>
          <div><label class="ts-label" for="p-email">邮箱</label><input id="p-email" class="ts-field" type="email"></div>
          <button class="ts-btn quiet" type="submit">保存资料</button>
          <p class="ts-meta" id="profile-msg" role="status"></p>
        </form>
      </section>

      <section class="ts-sheet">
        <h2>修改密码</h2>
        <form id="password" class="ts-stack">
          <div><label class="ts-label" for="pw-old">当前密码</label><input id="pw-old" class="ts-field" type="password" autocomplete="current-password" required></div>
          <div><label class="ts-label" for="pw-new">新密码 <span class="ts-hint">至少 10 位，含字母、数字或符号中的两类</span></label><input id="pw-new" class="ts-field" type="password" autocomplete="new-password" required></div>
          <button class="ts-btn quiet" type="submit">修改密码</button>
          <p class="ts-meta" id="password-msg" role="status"></p>
        </form>
      </section>

      <section class="ts-sheet acct-full">
        <div class="usage-head">
          <div>
            <h2 style="margin-bottom:4px">近期用量统计</h2>
            <p class="ts-meta" style="margin:0">按日统计审阅任务触发的模型与检索调用次数。</p>
          </div>
          <div class="usage-toolbar">
            <div class="usage-legend">
              <span><i class="u-swatch model"></i>模型调用</span>
              <span><i class="u-swatch search"></i>检索调用</span>
            </div>
            <div class="usage-switch" role="group" aria-label="统计周期">
              <button type="button" class="fbtn" data-days="7" aria-pressed="false">近 7 天</button>
              <button type="button" class="fbtn" data-days="14" aria-pressed="true">近 14 天</button>
              <button type="button" class="fbtn" data-days="30" aria-pressed="false">近一个月</button>
            </div>
          </div>
        </div>

        <div class="usage-kpis" id="usage-kpis"></div>

        <div class="usage-chart-wrap">
          <div class="usage-chart" id="usage-chart" aria-label="近期每日调用次数柱状图"></div>
        </div>
      </section>
    </div>

    <section class="ts-sheet" id="admin" style="margin-top:20px" hidden>
      <h2>受邀账号管理</h2>
      <form id="create" class="admin-create-grid" style="margin-bottom:18px">
        <div><label class="ts-label" for="c-user">用户名</label><input id="c-user" class="ts-field" required></div>
        <div><label class="ts-label" for="c-email">邮箱</label><input id="c-email" class="ts-field" type="email" required></div>
        <div><label class="ts-label" for="c-role">角色</label><select id="c-role" class="ts-field"><option value="member">成员</option><option value="admin">管理员</option></select></div>
        <div class="admin-submit-cell"><button class="ts-btn" type="submit" style="width:100%">开通账号</button></div>
      </form>
      <div id="admin-msg" role="status"></div>
      <div style="overflow-x:auto"><table class="users"><thead><tr><th>用户名</th><th>邮箱</th><th>角色</th><th>状态</th><th>最近登录</th><th></th></tr></thead><tbody id="users"></tbody></table></div>
    </section>
  </main>

  <script src="/trisight.js"></script>
  <script>
  (async () => {
    const user = await TS.guard('account');
    if (!user) return;
    const $ = (id) => document.getElementById(id);
    const esc = TS.esc;
    const ROLE = { admin: '管理员', member: '成员' };
    let pendingAvatar = user.avatar || '';

    function renderAvatarPreview() {
      const previewUser = { ...user, display_name: $('p-name').value || user.display_name || user.username, avatar: pendingAvatar };
      $('avatar-preview').innerHTML = TS.avatarHtml(previewUser, 60);
    }

    function fillProfile(u) {
      Object.assign(user, u);
      pendingAvatar = u.avatar || '';
      $('profile-kv').innerHTML = '<dt>用户名</dt><dd>' + esc(u.username) + '</dd><dt>角色</dt><dd>' + (ROLE[u.role] || u.role) + '</dd>' +
        '<dt>最近登录</dt><dd>' + (u.last_login_at ? TS.time(u.last_login_at) : '—') + '</dd>';
      $('p-name').value = u.display_name || ''; $('p-email').value = u.email || '';
      renderAvatarPreview();
    }
    fillProfile(user);

    $('avatar-file').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 128;
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
          pendingAvatar = canvas.toDataURL('image/jpeg', 0.86);
          renderAvatarPreview();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    $('profile').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('profile-msg').textContent = '正在保存…';
      try {
        const d = await TS.api('/api/auth/profile', {
          method: 'POST',
          body: { display_name: $('p-name').value, email: $('p-email').value, avatar: pendingAvatar },
        });
        fillProfile(d.user); TS.bar('account', d.user); $('profile-msg').textContent = '资料已保存。';
      } catch (err) { $('profile-msg').textContent = err.message; }
    });

    $('password').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const d = await TS.api('/api/auth/password', { method: 'POST', body: { current_password: $('pw-old').value, new_password: $('pw-new').value } });
        try { if (d.session_token) sessionStorage.setItem('ev_session_token', d.session_token); } catch (_) {}
        $('password').reset(); $('password-msg').textContent = '密码已修改，其他设备上的登录已退出。';
      } catch (err) { $('password-msg').textContent = err.message; }
    });

    // ---------------- Usage Bar Chart (Calls Only, 7/14/30d) ----------------
    let currentDays = 14;
    let assistRows = [];

    function dayKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function buildDailySeries(rows, numDays) {
      const days = [];
      const map = {};
      const now = new Date();
      for (let i = numDays - 1; i >= 0; i--) {
        const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        const key = dayKey(dt);
        const label = String(dt.getMonth() + 1).padStart(2, '0') + '/' + String(dt.getDate()).padStart(2, '0');
        const item = { key, label, model_calls: 0, search_calls: 0, assists: 0 };
        days.push(item);
        map[key] = item;
      }
      for (const r of rows || []) {
        if (!r.created) continue;
        const dt = new Date(r.created * 1000);
        const bucket = map[dayKey(dt)];
        if (!bucket) continue;
        bucket.assists += 1;
        const mc = typeof r.model_calls === 'number' ? r.model_calls : (r.state === 'completed' ? 2 : 1);
        const sc = typeof r.search_calls === 'number' ? r.search_calls : 0;
        bucket.model_calls += mc;
        bucket.search_calls += sc;
      }
      return days;
    }

    function renderUsage() {
      const series = buildDailySeries(assistRows, currentDays);
      const totalAssists = series.reduce((a, b) => a + b.assists, 0);
      const totalModel = series.reduce((a, b) => a + b.model_calls, 0);
      const totalSearch = series.reduce((a, b) => a + b.search_calls, 0);
      const totalCalls = totalModel + totalSearch;
      const rangeText = currentDays === 7 ? '近 7 天' : currentDays === 30 ? '近一个月' : '近 14 天';

      $('usage-kpis').innerHTML =
        '<div class="u-kpi"><span class="u-kpi-label">' + rangeText + '审阅任务</span><strong class="u-kpi-val">' + totalAssists + ' <small>次</small></strong></div>' +
        '<div class="u-kpi"><span class="u-kpi-label">' + rangeText + ' API 调用</span><strong class="u-kpi-val">' + totalCalls + ' <small>次</small></strong><span class="ts-meta">模型 ' + totalModel + ' · 检索 ' + totalSearch + '</span></div>';

      const maxVal = Math.max(6, ...series.map((d) => d.model_calls + d.search_calls));
      const chart = $('usage-chart');
      chart.style.gridTemplateColumns = `repeat(${currentDays}, minmax(0, 1fr))`;

      chart.innerHTML = series.map((d, idx) => {
        const mVal = d.model_calls;
        const sVal = d.search_calls;
        const total = mVal + sVal;
        const mPct = Math.min(100, (mVal / maxVal) * 100);
        const sPct = Math.min(100 - mPct, (sVal / maxVal) * 100);
        const topLabel = total > 0 ? String(total) : '';
        const showAxisLabel = currentDays <= 14 || idx % 3 === 0 || idx === currentDays - 1;
        const tip = `${d.key}：共 ${total} 次调用（模型 ${d.model_calls} 次，检索 ${d.search_calls} 次）`;
        return '<div class="u-col" title="' + esc(tip) + '">' +
          '<div class="u-bar-track">' +
            (topLabel ? '<span class="u-bar-val" style="bottom:' + (mPct + sPct) + '%">' + esc(topLabel) + '</span>' : '') +
            '<div class="u-bar-stack" style="height:' + (mPct + sPct) + '%">' +
              (sVal > 0 ? '<div class="u-seg search" style="flex:' + sVal + '"></div>' : '') +
              (mVal > 0 ? '<div class="u-seg model" style="flex:' + mVal + '"></div>' : '') +
            '</div>' +
          '</div>' +
          '<span class="u-col-label">' + (showAxisLabel ? esc(d.label) : '') + '</span>' +
        '</div>';
      }).join('');
    }

    document.querySelectorAll('[data-days]').forEach((btn) => btn.addEventListener('click', () => {
      currentDays = Number(btn.dataset.days) || 14;
      document.querySelectorAll('[data-days]').forEach((b) => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
      renderUsage();
    }));

    TS.api('/api/assist?limit=100').then((h) => {
      assistRows = (h && h.rows) || [];
      renderUsage();
    }).catch(() => renderUsage());

    if (user.role !== 'admin') return;
    $('admin').hidden = false;
    const note = (html) => { $('admin-msg').innerHTML = html ? '<div class="ts-note" style="margin-bottom:14px">' + html + '</div>' : ''; };

    async function loadUsers() {
      const d = await TS.api('/api/auth/admin/users');
      $('users').innerHTML = d.users.map((u) => '<tr><td>' + TS.avatarHtml(u, 22) + ' <span style="vertical-align:middle;margin-left:6px">' + esc(u.username) + '</span></td><td>' + esc(u.email) + '</td><td>' + (ROLE[u.role] || u.role) + '</td>' +
        '<td>' + (u.status === 'active' ? '启用' : '停用') + '</td><td>' + (u.last_login_at ? TS.time(u.last_login_at) : '从未') + '</td>' +
        '<td style="white-space:nowrap">' + (u.id === user.id ? '<span class="ts-meta">当前账号</span>' :
          '<button class="ts-link" data-act="status" data-id="' + u.id + '" data-to="' + (u.status === 'active' ? 'disabled' : 'active') + '">' + (u.status === 'active' ? '停用' : '启用') + '</button> ' +
          '<button class="ts-link" data-act="reset" data-id="' + u.id + '" data-name="' + esc(u.username) + '">重置密码</button>') + '</td></tr>').join('');
      $('users').querySelectorAll('button').forEach((b) => b.addEventListener('click', async () => {
        try {
          const body = b.dataset.act === 'status' ? { status: b.dataset.to } : { generate_password: true };
          const d2 = await TS.api('/api/auth/admin/users/' + b.dataset.id, { method: 'POST', body });
          note(d2.generated_password ? esc(b.dataset.name) + ' 的临时密码：<b>' + esc(d2.generated_password) + '</b>。只显示这一次，请转交本人并提醒修改。' : '已更新。');
          loadUsers();
        } catch (err) { note(esc(err.message)); }
      }));
    }
    $('create').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const d = await TS.api('/api/auth/admin/users', { method: 'POST', body: { username: $('c-user').value, email: $('c-email').value, role: $('c-role').value } });
        note('已开通 ' + esc(d.user.username) + '。临时密码：<b>' + esc(d.generated_password) + '</b>。只显示这一次，请转交本人并提醒修改。');
        $('create').reset(); loadUsers();
      } catch (err) { note(esc(err.message)); }
    });
    loadUsers().catch((err) => note(esc(err.message)));
  })();
  </script>
</body>
</html>
