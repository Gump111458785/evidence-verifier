<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>审阅：Trisight 三省</title>
  <link rel="icon" href="/favicon.svg?v=053" type="image/svg+xml">
  <link rel="stylesheet" href="/trisight.css">
</head>
<body>
  <div class="ts-bar-wrap"><header id="ts-bar"></header></div>
  <main class="ts-page">
    <h1 style="margin-bottom:22px">审阅</h1>

    <div class="ts-split">
      <form id="form" class="ts-sheet ts-stack" novalidate>
        <div>
          <label class="ts-label" for="question">你的问题</label>
          <textarea id="question" class="ts-field" rows="2" maxlength="1000" required placeholder="例如：埃菲尔铁塔是哪一年建成的？"></textarea>
        </div>
        <div>
          <label class="ts-label" for="answer">大模型的回答 <span class="ts-hint">最多 5,000 字</span></label>
          <textarea id="answer" class="ts-field" rows="8" maxlength="5000" required placeholder="把回答原文粘贴到这里"></textarea>
        </div>
        <details class="ts-more">
          <summary>前几轮对话（可选，用于补充和预测）</summary>
          <textarea id="context" class="ts-field" rows="4" maxlength="2000" placeholder="每行以“用户：”或“AI：”开头，最多 10 轮、2,000 字"></textarea>
        </details>
        <details class="ts-more">
          <summary>来源原文（可选，提供后纠错只用它核对，不再检索）</summary>
          <div class="ts-stack">
            <textarea id="source" class="ts-field" rows="4" maxlength="4000" placeholder="粘贴来源中的原文段落，最多 4,000 字"></textarea>
            <input id="source-url" class="ts-field" type="url" placeholder="来源链接（可选）">
          </div>
        </details>
        <fieldset style="border:0;padding:0;margin-top:18px">
          <legend class="ts-label">审阅方式</legend>
          <div class="seg-tabs">
            <label><input type="radio" name="how" value="auto" checked><span>自动判定</span></label>
            <label><input type="radio" name="how" value="manual"><span>手动选择</span></label>
          </div>
          <div class="mode-checks" id="manual" hidden>
            <label><input type="checkbox" name="mode" value="correct" checked><span class="dot correct"></span>纠错</label>
            <label><input type="checkbox" name="mode" value="supplement" checked><span class="dot supplement"></span>补充</label>
            <label><input type="checkbox" name="mode" value="predict" checked><span class="dot predict"></span>预测</label>
          </div>
        </fieldset>
        <div id="form-error" class="ts-alert" role="alert" hidden></div>
        <div>
          <button class="ts-btn" id="run" type="submit">开始审阅</button>
        </div>
      </form>

      <section aria-live="polite">
        <div id="resume" class="ts-note" style="margin-bottom:14px" hidden>这次审阅没有跑完。<button class="ts-link" id="resume-btn" type="button">继续运行</button></div>
        <div id="result" class="ts-sheet"><p class="res-empty">结果会显示在这里。<br>也可以先去<a href="/library.html">案例库</a>看看示例。</p></div>
      </section>
    </div>
  </main>

  <script src="/trisight.js"></script>
  <script>
  (async () => {
    const user = await TS.guard('assist');
    if (!user) return;
    const $ = (id) => document.getElementById(id);
    const form = $('form'), result = $('result');

    function syncModeUI() {
      const manual = document.querySelector('input[name=how]:checked').value === 'manual';
      $('manual').hidden = !manual;
    }
    document.querySelectorAll('input[name=how]').forEach((r) => r.addEventListener('change', syncModeUI));
    syncModeUI();

    function parseContext(text) {
      const turns = [];
      for (const raw of text.split('\n')) {
        const line = raw.trim();
        if (!line) continue;
        const m = line.match(/^(用户|我|User|AI|助手|Assistant)\s*[:：]\s*(.*)$/i);
        if (m) turns.push({ role: /^(用户|我|user)$/i.test(m[1]) ? 'user' : 'assistant', text: m[2] });
        else if (turns.length) turns[turns.length - 1].text += '\n' + line;
        else turns.push({ role: 'user', text: line });
      }
      return turns;
    }

    const STAGES = [
      { key: 'review', num: '1', title: '判断与初审', desc: '判定纠错 / 补充 / 预测适用性，并定位待核验断言' },
      { key: 'search', num: '2', title: '检索原文', desc: '联网查找公开文献与可靠来源全文片段' },
      { key: 'verify', num: '3', title: '逐条核验', desc: '将断言逐一比对证据原文并回放引文位置' },
      { key: 'compose', num: '4', title: '修订回答', desc: '汇总纠错与补充建议，整理修订稿与提示词' },
    ];
    let tlClock = null;
    let tlRunStart = 0;
    const tlDurations = {};

    function stopTimelineClock() {
      if (tlClock) { clearInterval(tlClock); tlClock = null; }
    }

    function renderTimeline(activeKey, completedKeys = new Set(), skippedKeys = new Set(), phaseStartedAt = Date.now()) {
      stopTimelineClock();
      const activeIdx = STAGES.findIndex((s) => s.key === activeKey);
      const itemsHtml = STAGES.map((st, idx) => {
        let status = 'wait';
        if (skippedKeys.has(st.key)) status = 'skipped';
        else if (completedKeys.has(st.key) || (activeIdx >= 0 && idx < activeIdx && !skippedKeys.has(st.key))) status = 'done';
        else if (st.key === activeKey) status = 'active';
        const icon = status === 'done' ? '✓' : status === 'skipped' ? '—' : st.num;
        let meta = '等待中';
        if (status === 'done') meta = tlDurations[st.key] ? `已完成 · ${tlDurations[st.key]}` : '已完成';
        else if (status === 'skipped') meta = '已跳过';
        else if (status === 'active') meta = '进行中 · 0.0s';
        return `<li class="ts-tl-item" data-status="${status}" data-stage="${st.key}">` +
          `<span class="ts-tl-node">${icon}</span>` +
          `<div class="ts-tl-body">` +
            `<div class="ts-tl-row"><span class="ts-tl-title">${TS.esc(st.title)}</span><span class="ts-tl-meta" id="tl-meta-${st.key}">${meta}</span></div>` +
            `<p class="ts-tl-desc">${TS.esc(st.desc)}</p>` +
          `</div>` +
        `</li>`;
      }).join('');

      result.innerHTML = `<div class="ts-timeline">` +
        `<div class="ts-tl-head"><strong>审阅阶段进程</strong><span id="tl-total">已耗时 ${((Date.now() - tlRunStart) / 1000).toFixed(1)}s</span></div>` +
        `<ol class="ts-tl-list">${itemsHtml}</ol>` +
      `</div>`;

      tlClock = setInterval(() => {
        const metaEl = document.getElementById('tl-meta-' + activeKey);
        const totalEl = document.getElementById('tl-total');
        if (!metaEl && !totalEl) { stopTimelineClock(); return; }
        if (metaEl) metaEl.textContent = `进行中 · ${((Date.now() - phaseStartedAt) / 1000).toFixed(1)}s`;
        if (totalEl) totalEl.textContent = `已耗时 ${((Date.now() - tlRunStart) / 1000).toFixed(1)}s`;
      }, 100);
    }

    function show(job) {
      stopTimelineClock();
      const errText = String(job.error || job.state || '');
      const nonRetryable = /402|余额不足|密钥/.test(errText);
      $('resume').hidden = nonRetryable || !(job.state === 'queued' || (job.state === 'failed' && job.advance_path));
      if (job.state === 'completed') {
        TS.render(result, { question: job.input.question, answer: job.input.answer, result: job.result, id: job.id, feedback: job.feedback });
      } else if (job.state === 'failed' || job.state === 'canceled') {
        const suffix = nonRetryable ? '' : '。可点击上方“继续运行”重试当前步骤。';
        result.innerHTML = '<div class="ts-alert">审阅未完成：' + TS.esc(errText) + suffix + '</div>';
      }
    }

    let current = null;
    async function drive(job, allowRetry = false) {
      current = job.id;
      $('run').disabled = true;
      tlRunStart = Date.now();
      for (const k of Object.keys(tlDurations)) delete tlDurations[k];
      const completed = new Set();
      const skipped = new Set();
      try {
        if (allowRetry && job.state === 'failed' && job.advance_path) {
          const phase = (job.progress || {}).phase || 'review';
          const started = Date.now();
          renderTimeline(phase, completed, skipped, started);
          job = await TS.api(job.advance_path, { method: 'POST' });
          tlDurations[phase] = ((Date.now() - started) / 1000).toFixed(1) + 's';
          if (job.state !== 'failed') completed.add(phase);
        }
        while (job.state === 'queued') {
          $('resume').hidden = true;
          const phase = (job.progress || {}).phase || 'review';
          const phaseIdx = STAGES.findIndex((s) => s.key === phase);
          for (let i = 0; i < phaseIdx; i++) {
            const prevKey = STAGES[i].key;
            if (!completed.has(prevKey)) skipped.add(prevKey);
          }
          const started = Date.now();
          renderTimeline(phase, completed, skipped, started);
          job = await TS.api(job.advance_path, { method: 'POST' });
          if (job.state !== 'failed') {
            tlDurations[phase] = ((Date.now() - started) / 1000).toFixed(1) + 's';
            completed.add(phase);
          }
        }
        show(job);
        history.replaceState(null, '', '/assist.html?id=' + job.id);
      } catch (e) {
        stopTimelineClock();
        result.innerHTML = '';
        TS.alertIn(result, e.message);
        $('resume').hidden = false;
      } finally {
        stopTimelineClock();
        $('run').disabled = false;
      }
    }

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      $('form-error').hidden = true;
      const question = $('question').value.trim(), answer = $('answer').value.trim();
      if (!question || !answer) { $('form-error').textContent = '请填写问题和大模型的回答。'; $('form-error').hidden = false; return; }
      const body = { question, answer, compose: true, client: 'web' };
      const ctx = parseContext($('context').value);
      if (ctx.length) body.context = ctx;
      if ($('source').value.trim()) body.sources = [{ text: $('source').value.trim(), url: $('source-url').value.trim() || null }];
      if (document.querySelector('input[name=how]:checked').value === 'manual') {
        body.modes = [...document.querySelectorAll('input[name=mode]:checked')].map((c) => c.value);
        if (!body.modes.length) { $('form-error').textContent = '手动选择时至少勾选一种模式。'; $('form-error').hidden = false; return; }
      } else body.modes = 'auto';
      try {
        TS.danmaku('正在审阅中…', 'running', 2200);
        tlRunStart = Date.now();
        renderTimeline('review', new Set(), new Set(), Date.now());
        const job = await TS.api('/api/assist', { method: 'POST', body });
        await drive(job);
      } catch (e) {
        stopTimelineClock();
        TS.danmaku('启动失败：' + e.message, 'error', 3000);
        $('form-error').textContent = e.message; $('form-error').hidden = false;
      }
    });

    $('resume-btn').addEventListener('click', async () => { if (current) await drive(await TS.api('/api/assist/' + current), true); });

    const id = new URLSearchParams(location.search).get('id');
    if (id && /^[a-f0-9]{24}$/.test(id)) {
      current = id;
      try {
        const job = await TS.api('/api/assist/' + id);
        $('question').value = job.input.question; $('answer').value = job.input.answer;
        show(job);
      } catch (e) { TS.alertIn(result, e.message); }
    }
  })();
  </script>
</body>
</html>
