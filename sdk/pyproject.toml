[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-verifier-client"
version = "0.2.0"
description = "Client for auditable declared-relation evidence verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_verifier = ["py.typed"]
